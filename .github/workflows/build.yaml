name: Build Guix Installer

on:
  push:
    branches: [ master ]
  schedule:
    - cron: "0 0 */7 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guix-installer-publish
  cancel-in-progress: false

env:
  FTP_UPLOAD_URL: ${{ vars.FTP_UPLOAD_URL }}
  DOWNLOAD_BASE_URL: ${{ vars.DOWNLOAD_BASE_URL }}

jobs:
  preflight:
    runs-on: namespace-profile-guix-installer
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify FTPS publication and HTTPS downloads
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: bash scripts/ftp-upload.sh preflight

  build:
    # Guix needs mount/user namespaces for its build sandboxes.
    runs-on: namespace-profile-guix-installer;container.privileged=true
    needs: preflight
    permissions:
      contents: write
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free up disk space
        run: |
          # Remove pre-installed software to make room for the ISO build.
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/share/swift
          df -h /
      - name: Guix cache restore
        id: guix-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/guix
          # Refresh the cache on scheduled builds even when the commit is unchanged.
          key: guix-cache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: guix-cache-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Guix
        run: bash scripts/install-guix.sh
      - name: Build ISO
        run: |
          set -euo pipefail
          guix time-machine -C ./guix/base-channels.scm -- describe -f channels > ./guix/channels.scm
          image=$(guix time-machine -C ./guix/channels.scm -- system image -t iso9660 ./guix/installer.scm)
          RELEASE_TAG=$(date +"%Y%m%d%H%M")
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          cp "$image" "./guix-installer-$RELEASE_TAG.iso"
      - name: Compress ISO
        run: zstd -19 "guix-installer-$RELEASE_TAG.iso"
      - name: Check ISO size
        run: |
          ls -lh "guix-installer-$RELEASE_TAG.iso.zst"
          stat --printf='%s bytes\n' "guix-installer-$RELEASE_TAG.iso.zst"
      - name: Guix cache save
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.guix-cache.outcome == 'success'
        with:
          path: ~/.cache/guix
          key: ${{ steps.guix-cache.outputs.cache-primary-key }}
      - name: Prepare Release Notes
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          The attached installer image is compressed with zstd. Decompress it before writing to USB:

          ```sh
          zstd -d guix-installer-*.iso.zst
          ```

          Uncompressed `.iso` downloads linked below can be written directly to USB.

          Installer image prepared with the following channel configuration:

          NOTES
          {
            echo '```scheme'
            cat ./guix/channels.scm
            echo '```'
          } >> release-notes.md
      - name: Upload ISOs over FTPS
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          # Publish both dated files before changing either latest download.
          for suffix in iso iso.zst; do
            FILE="guix-installer-${RELEASE_TAG}.$suffix"
            bash scripts/ftp-upload.sh upload "$FILE" "$FILE"
          done
          for suffix in iso iso.zst; do
            FILE="guix-installer-${RELEASE_TAG}.$suffix"
            LATEST_FILE="guix-installer-latest.$suffix"
            bash scripts/ftp-upload.sh upload "$FILE" "$LATEST_FILE"
            DOWNLOAD_URL="${DOWNLOAD_BASE_URL%/}/$FILE"
            DOWNLOAD_URL_LATEST="${DOWNLOAD_BASE_URL%/}/$LATEST_FILE"
            ISO_BYTES=$(stat --printf='%s' "$FILE")
            ISO_SIZE=$(numfmt --to=iec-i --suffix=B "$ISO_BYTES")
            {
              echo ""
              echo "## $FILE"
              echo ""
              echo "**Direct Download:** [$DOWNLOAD_URL]($DOWNLOAD_URL)"
              echo ""
              echo "**Latest Version:** [$DOWNLOAD_URL_LATEST]($DOWNLOAD_URL_LATEST)"
              echo ""
              echo "**Size:** $ISO_SIZE ($ISO_BYTES bytes)"
              echo ""
              echo "**SHA256 Checksum:**"
              echo '```'
              sha256sum "$FILE"
              echo '```'
            } >> release-notes.md
          done
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Guix Installer - ${{ env.RELEASE_TAG }}
          tag_name: v${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: guix-installer-${{ env.RELEASE_TAG }}.iso.zst
      - name: Stop Guix daemon
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/guix-daemon.pid" ]; then
            sudo kill -- "$(cat "$RUNNER_TEMP/guix-daemon.pid")" || true
          fi
