name: Build Guix Installer

on:
  push:
    branches:
      - master

  schedule:
    - cron: "0 0 */7 * *"

  workflow_dispatch:

jobs:
  build:
    runs-on: buildjet-8vcpu-ubuntu-2204
    steps:
      - name: Aggressive cleanup
        run: |
          df -h
          sudo rm -rf /usr/lib/jvm &
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/share/swift &
          sudo rm -rf /usr/local/.ghcup &
          sudo rm -rf /usr/local/julia* &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /usr/local/share/chromium &
          sudo rm -rf /opt/microsoft /opt/google &
          sudo rm -rf /opt/az &
          sudo rm -rf /usr/local/share/powershell &
          sudo rm -rf /opt/hostedtoolcache &

          wait
                
          sudo du -sh /* 2>/dev/null | sort -hr | head -20
          echo ""
          sudo du -sh /usr/* 2>/dev/null | sort -hr | head -20
          echo ""
          sudo du -sh /opt/* 2>/dev/null | sort -hr | head -10
          echo ""
          df -h

      - name: Git checkout
        uses: actions/checkout@v4
        
      - name: Guix cache restore
        uses: actions/cache/restore@v3
        with:
          path: ~/.cache/guix
          key: guix-cache-${{ github.sha }}
          restore-keys: |
            guix-cache-

      - name: Install Guix
        uses: PromyLOPh/guix-install-action@v1.6
        with:
          channels: |
            (cons* (channel
                     (name 'nonguix)
                     (url "https://gitlab.com/nonguix/nonguix")
                     (introduction
                       (make-channel-introduction
                         "897c1a470da759236cc11798f4e0a5f7d4d59fbc"
                         (openpgp-fingerprint
                           "2A39 3FFF 68F4 EF7A 3D29  12AF 6F51 20A0 22FB B2D5"))))
                    %default-channels)

      - name: Set up Nonguix Substitutes
        run: |
          wget https://substitutes.nonguix.org/signing-key.pub
          mv signing-key.pub nonguix-signing-key.pub
          sudo /var/guix/profiles/per-user/root/current-guix/bin/guix archive --authorize < nonguix-signing-key.pub

      - name: Set daemon level Substitutes
        run: |
          SUBSTITUTE_URLS="https://ci.guix.gnu.org https://bordeaux.guix.gnu.org https://substitutes.nonguix.org"
          
          sudo sed -i "s|--substitute-urls='https://bordeaux.guix.gnu.org https://ci.guix.gnu.org'|--substitute-urls='$SUBSTITUTE_URLS'|g" /etc/systemd/system/guix-daemon.service
                
          sudo systemctl daemon-reload
          sudo systemctl restart guix-daemon.service    
    
      - name: Build ISO
        run: |
          guix time-machine -C ./guix/base-channels.scm -- describe -f channels > ./guix/channels.scm
          image=$(guix time-machine -C ./guix/channels.scm -- system image -t iso9660 ./guix/installer.scm)
          export RELEASE_TAG=$(date +"%Y%m%d%H%M")
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          cp $image ./guix-installer-$RELEASE_TAG.iso
          
      - name: Guix cache save
        uses: actions/cache/save@v3
        if: always()
        with:
          path: ~/.cache/guix
          key: guix-cache-${{ github.sha }}

      - name: Prepare Release Notes
        run: |
          echo $'Installer image prepared with the following channel configuration:\r\n\r\n```\r\n' > release-notes.md
          cat ./guix/channels.scm >> release-notes.md
          echo $'\r\n```' >> release-notes.md

      - name: Configure R2 Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws-region: auto

      - name: Upload ISO to R2
        run: |
          BUCKET_NAME="guix-installers"
          ACCOUNT_ID="${{ secrets.R2_ACCOUNT_ID }}"
          R2_ENDPOINT="https://$ACCOUNT_ID.r2.cloudflarestorage.com"
          
          # Upload versioned ISO
          aws s3 cp guix-installer-${{ env.RELEASE_TAG }}.iso \
            s3://$BUCKET_NAME/guix-installer-${{ env.RELEASE_TAG }}.iso \
            --endpoint-url $R2_ENDPOINT
          
          # Upload as "latest" for convenience
          aws s3 cp guix-installer-${{ env.RELEASE_TAG }}.iso \
            s3://$BUCKET_NAME/guix-installer-latest.iso \
            --endpoint-url $R2_ENDPOINT
          
          R2_PUBLIC_URL="https://guix.aamu.cloud"
          DOWNLOAD_URL="$R2_PUBLIC_URL/guix-installer-${{ env.RELEASE_TAG }}.iso"
          DOWNLOAD_URL_LATEST="$R2_PUBLIC_URL/guix-installer-latest.iso"
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV
          echo "DOWNLOAD_URL_LATEST=$DOWNLOAD_URL_LATEST" >> $GITHUB_ENV
          
          ISO_SIZE=$(ls -lh guix-installer-${{ env.RELEASE_TAG }}.iso | awk '{print $5}')
          echo "ISO_SIZE=$ISO_SIZE" >> $GITHUB_ENV
          
          cat >> release-notes.md << EOF
          
## Download ISO

**Direct Download (This Version):** [$DOWNLOAD_URL]($DOWNLOAD_URL)

**Latest Version (Always Current):** [$DOWNLOAD_URL_LATEST]($DOWNLOAD_URL_LATEST)

**Size:** $ISO_SIZE

**SHA256 Checksum:**
\`\`\`
$(sha256sum guix-installer-$RELEASE_TAG.iso | awk '{print $1}')
\`\`\`
EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Guix Installer - ${{ env.RELEASE_TAG }}
          tag_name: v${{ env.RELEASE_TAG }}
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
