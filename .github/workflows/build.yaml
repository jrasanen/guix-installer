name: Build Guix Installer

on:
  push:
    branches: [ master ]
  schedule:
    - cron: "0 0 */7 * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_REGION: auto
  AWS_DEFAULT_REGION: auto
  BUCKET_NAME: guix-builds
  R2_ENDPOINT: https://53ebb30ac76e1f28a97a60cc881a7033.eu.r2.cloudflarestorage.com
  R2_PUBLIC_URL: https://guix.aamu.cloud

jobs:
  preflight:
    runs-on: buildjet-4vcpu-ubuntu-2204
    steps:
      - name: Install AWS CLI
        run: |
          python3 -m pip install --upgrade --user awscli
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          aws --version
      - name: Validate env present
        run: |
          set -euo pipefail
          test -n "${BUCKET_NAME}"
          test -n "${R2_ENDPOINT}"
      - name: Require MPU permissions and S3 cp works
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          B="$BUCKET_NAME"
          E="$R2_ENDPOINT"
          PREFIX="_preflight/$(openssl rand -hex 6)"
          mkdir -p _preflight
          dd if=/dev/zero of=_preflight/ten_mb.bin bs=1M count=10 status=none
          echo ok > _preflight/small.txt
          UPLOAD_ID=$(aws s3api create-multipart-upload --bucket "$B" --key "$PREFIX/mpu.bin" --endpoint-url "$E" --query UploadId --output text 2>/dev/null || true)
          if [ -z "${UPLOAD_ID:-}" ] || [ "$UPLOAD_ID" = "None" ]; then
            echo "Multipart upload not permitted on bucket $B. Grant CreateMultipartUpload/UploadPart/CompleteMultipartUpload/AbortMultipartUpload." >&2
            exit 1
          fi
          aws s3api abort-multipart-upload --bucket "$B" --key "$PREFIX/mpu.bin" --upload-id "$UPLOAD_ID" --endpoint-url "$E" >/dev/null 2>&1 || true
          aws configure set default.s3.multipart_threshold 8MB
          aws configure set default.s3.multipart_chunksize 8MB
          aws s3 cp _preflight/ten_mb.bin "s3://$B/$PREFIX/ten_mb.bin" --endpoint-url "$E" >/dev/null
          aws s3 rm "s3://$B/$PREFIX/ten_mb.bin" --endpoint-url "$E" >/dev/null
          aws configure set default.s3.multipart_threshold 8MB
          aws configure set default.s3.multipart_chunksize 8MB

  build:
    runs-on: buildjet-4vcpu-ubuntu-2204
    needs: preflight
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
      - name: Guix cache restore
        uses: actions/cache/restore@v3
        with:
          path: ~/.cache/guix
          key: guix-cache-${{ github.sha }}
          restore-keys: guix-cache-
      - name: Install Guix
        uses: PromyLOPh/guix-install-action@v1.6
        with:
          channels: |
            (cons* (channel
                     (name 'nonguix)
                     (url "https://gitlab.com/nonguix/nonguix")
                     (introduction
                       (make-channel-introduction
                         "897c1a470da759236cc11798f4e0a5f7d4d59fbc"
                         (openpgp-fingerprint
                           "2A39 3FFF 68F4 EF7A 3D29  12AF 6F51 20A0 22FB B2D5"))))
                    %default-channels)
      - name: Set up Nonguix Substitutes
        run: |
          set -euo pipefail
          wget -q https://substitutes.nonguix.org/signing-key.pub -O nonguix-signing-key.pub
          sudo /var/guix/profiles/per-user/root/current-guix/bin/guix archive --authorize < nonguix-signing-key.pub
      - name: Set daemon level Substitutes
        run: |
          set -euo pipefail
          SUBSTITUTE_URLS="https://ci.guix.gnu.org https://bordeaux.guix.gnu.org https://substitutes.nonguix.org"
          sudo sed -i "s|--substitute-urls='https://bordeaux.guix.gnu.org https://ci.guix.gnu.org'|--substitute-urls='$SUBSTITUTE_URLS'|g" /etc/systemd/system/guix-daemon.service
          sudo systemctl daemon-reload
          sudo systemctl restart guix-daemon.service
      - name: Build ISO
        run: |
          set -euo pipefail
          guix time-machine -C ./guix/base-channels.scm -- describe -f channels > ./guix/channels.scm
          image=$(guix time-machine -C ./guix/channels.scm -- system image -t iso9660 ./guix/installer.scm)
          export RELEASE_TAG=$(date +"%Y%m%d%H%M")
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          cp "$image" "./guix-installer-$RELEASE_TAG.iso"
      - name: Guix cache save
        uses: actions/cache/save@v3
        if: always()
        with:
          path: ~/.cache/guix
          key: guix-cache-${{ github.sha }}
      - name: Prepare Release Notes
        run: |
          set -euo pipefail
          {
            echo $'Installer image prepared with the following channel configuration:\r\n\r\n```\r\n'
            cat ./guix/channels.scm
            echo $'\r\n```'
          } > release-notes.md
      - name: Install AWS CLI
        run: |
          python3 -m pip install --upgrade --user awscli
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          aws --version
      - name: Upload ISO to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          retry() { n=0; until "$@"; do n=$((n+1)); [ $n -ge 5 ] && return 1; sleep $((n*n)); done; }
          RELEASE_TAG="${{ env.RELEASE_TAG }}"
          FILE="guix-installer-${RELEASE_TAG}.iso"
          E="$R2_ENDPOINT"
          B="$BUCKET_NAME"
          aws configure set default.s3.multipart_threshold 8MB
          aws configure set default.s3.multipart_chunksize 8MB
          retry aws s3 cp "$FILE" "s3://$B/$FILE" --endpoint-url "$E"
          retry aws s3 cp "$FILE" "s3://$B/guix-installer-latest.iso" --endpoint-url "$E"
          echo "DOWNLOAD_URL=$R2_PUBLIC_URL/$FILE" >> $GITHUB_ENV
          echo "DOWNLOAD_URL_LATEST=$R2_PUBLIC_URL/guix-installer-latest.iso" >> $GITHUB_ENV
          ISO_SIZE=$(ls -lh "$FILE" | awk '{print $5}')
          echo "ISO_SIZE=$ISO_SIZE" >> $GITHUB_ENV
          SHA256=$(sha256sum "$FILE" | awk '{print $1}')
          {
            echo ""
            echo "## ISO"
            echo ""
            echo "**Direct Download:** [${{ env.DOWNLOAD_URL }}](${{ env.DOWNLOAD_URL }})"
            echo ""
            echo "**Latest Version:** [${{ env.DOWNLOAD_URL_LATEST }}](${{ env.DOWNLOAD_URL_LATEST }})"
            echo ""
            echo "**Size:** $ISO_SIZE"
            echo ""
            echo "**SHA256 Checksum:**"
            echo '```'
            echo "$SHA256"
            echo '```'
          } >> release-notes.md
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Guix Installer - ${{ env.RELEASE_TAG }}
          tag_name: v${{ env.RELEASE_TAG }}
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
