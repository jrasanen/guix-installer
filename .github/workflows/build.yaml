name: Build Guix Installer

on:
  push:
    branches: [ master ]
  schedule:
    - cron: "0 0 */7 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guix-installer-publish
  cancel-in-progress: false

env:
  FTP_UPLOAD_URL: ${{ vars.FTP_UPLOAD_URL }}
  DOWNLOAD_BASE_URL: ${{ vars.DOWNLOAD_BASE_URL }}

jobs:
  preflight:
    runs-on:
      - namespace-profile-guix-installer
      - nscloud-cache-exp-do-not-commit
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check FTPS uploads and HTTPS downloads
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/ftp-upload.py preflight

  build:
    runs-on: namespace-profile-guix-installer;container.privileged=true
    needs: preflight
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Guix cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9
        with:
          path: |
            /gnu
            /var/guix
            ~/.cache/guix
      - name: Install Guix
        run: bash scripts/install-guix.sh
      - name: Build ISO
        run: bash scripts/build-iso.sh
      - name: Prune Guix cache
        env:
          GUIX_CACHE_MAX_BYTES: ${{ vars.GUIX_CACHE_MAX_BYTES }}
        run: bash scripts/prune-guix-cache.sh
      - name: Save installer
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: guix-installer-${{ github.run_attempt }}
          path: dist/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Stop Guix daemon
        if: always()
        run: bash scripts/stop-guix.sh

  publish:
    runs-on:
      - namespace-profile-guix-installer
      - nscloud-cache-exp-do-not-commit
    needs: build
    permissions:
      contents: write
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/
          merge-multiple: true
      - name: Publish ISO over FTPS
        id: publish
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: bash scripts/publish-iso.sh
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          name: Guix Installer - ${{ steps.publish.outputs.release_tag }}
          tag_name: v${{ steps.publish.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          body_path: dist/release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/SHA256SUMS
            dist/channels.scm
            ${{ steps.publish.outputs.iso_asset }}
